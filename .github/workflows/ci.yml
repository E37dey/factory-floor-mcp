name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: sample data is reproducible
        run: |
          python scripts/make_sample_data.py
          python -m pytest -q tests/test_analytics.py
      - run: python examples/morning_brief.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t factory-floor-mcp .
      - name: container serves MCP and refuses requests without a token
        run: |
          docker run -d --name mcp -p 8000:8000 -e FACTORY_MCP_TOKEN=ci-token-0123456789abcdefghij factory-floor-mcp
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:8000/mcp && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp -H 'content-type: application/json' -d '{}')
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp \
            -H 'authorization: Bearer ci-token-0123456789abcdefghij' \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "200"
          docker logs mcp
