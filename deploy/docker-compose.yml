# MCP server behind NGINX with TLS. The server itself is never exposed directly.
#   FACTORY_MCP_TOKEN=$(openssl rand -hex 32) docker compose up -d
services:
  factory-mcp:
    build: ..
    environment:
      FACTORY_MCP_TOKEN: ${FACTORY_MCP_TOKEN:?set FACTORY_MCP_TOKEN}
      FACTORY_MCP_PUBLIC_URL: https://mcp.plant.example
      FACTORY_MCP_MAX_LEVEL: internal
      # FACTORY_MCP_DATA: /data/plant.xlsx       # nightly export from SAP / MES
      # SAP_ODATA_BASE: https://s4.example/sap/opu/odata/sap/API_PRODUCTION_ORDER_2_SRV
      # SAP_USER / SAP_PASSWORD: read-only technical user
    volumes:
      - audit:/var/log/factory-mcp
      # - /srv/exports:/data:ro
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [factory-mcp]
volumes:
  audit:
