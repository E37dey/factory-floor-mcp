# Reverse proxy for the MCP server. Streamable HTTP may stream responses (SSE),
# so buffering is off and timeouts are long enough for slow tool calls.
server {
    listen 443 ssl;
    server_name mcp.plant.example;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # only the MCP endpoint and its OAuth metadata are exposed
    location ~ ^/(mcp|\.well-known/oauth-protected-resource) {
        proxy_pass http://factory-mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
    location / { return 404; }
}
